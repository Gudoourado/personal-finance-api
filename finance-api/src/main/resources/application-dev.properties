# ===== PERFIL DE DESENVOLVIMENTO =====
# Ligue com: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Troca o PostgreSQL por um H2 em memória: não precisa instalar banco,
# e os dados somem quando a aplicação para.

# ===== BANCO DE DADOS - H2 em memória =====
spring.datasource.url=jdbc:h2:mem:financedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== CONSOLE DO H2 =====
# Abra /h2-console e use a URL jdbc:h2:mem:financedb, usuário sa, sem senha.
spring.h2.console.enabled=true
