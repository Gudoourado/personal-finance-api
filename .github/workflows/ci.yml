name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: finance-api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: finance-api/pom.xml

      - name: Rodar os testes
        run: mvn -B test
